name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.8

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the package and ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff==0.16.8

      - name: Regenerate the wrappers and the stubs
        run: python scripts/generate_components.py

      - name: Fail if anything changed
        run: |
          if ! git diff --quiet; then
            echo "::error::charts/ is out of sync with scripts/generate_components.py"
            git diff --stat
            exit 1
          fi
          echo "charts/ matches the generator"

  build:
    name: Build & check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine trove-classifiers

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - name: Verify the classifiers exist
        # twine does not check them against the trove list, and PyPI rejects
        # the upload at the very end of a release if one is not a real one.
        run: |
          python - <<'PY'
          import pathlib, sys, tomllib
          from trove_classifiers import classifiers
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["classifiers"]
          unknown = [c for c in declared if c not in classifiers]
          if unknown:
              sys.exit(f"not valid PyPI classifiers: {unknown}")
          print(f"{len(declared)} classifiers are valid")
          PY

      - name: Verify the wheel ships the typing marker and stubs
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(iter(pathlib.Path("dist").glob("*.whl")))
          names = zipfile.ZipFile(wheel).namelist()
          missing = [n for n in ("reflex_nivo/py.typed", "reflex_nivo/base.pyi") if n not in names]
          stubs = [n for n in names if n.startswith("reflex_nivo/charts/") and n.endswith(".pyi")]
          if missing or not stubs:
              sys.exit(f"wheel is incomplete: missing={missing} chart stubs={len(stubs)}")
          print(f"{wheel.name}: {len(names)} files, {len(stubs)} chart stubs")
          PY

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
