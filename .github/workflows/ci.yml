name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.8

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  build:
    name: Build & check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - name: Verify the wheel ships the typing marker and stubs
        run: |
          python - <<'PY'
          import pathlib, zipfile, sys
          wheel = next(iter(pathlib.Path("dist").glob("*.whl")))
          names = zipfile.ZipFile(wheel).namelist()
          missing = [n for n in ("reflex_nivo/py.typed", "reflex_nivo/base.pyi") if n not in names]
          stubs = [n for n in names if n.startswith("reflex_nivo/charts/") and n.endswith(".pyi")]
          if missing or not stubs:
              sys.exit(f"wheel is incomplete: missing={missing} chart stubs={len(stubs)}")
          print(f"{wheel.name}: {len(names)} files, {len(stubs)} chart stubs")
          PY

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
