name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Check that the tag matches the version in pyproject.toml
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib, pathlib
          tag = os.environ["TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match project version {version} (expected v{version})")
          print(f"version={version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The PyPI trusted publisher is bound to this environment name.
    environment:
      name: pypi
      url: https://pypi.org/p/reflex-nivo
    permissions:
      id-token: write # OIDC token for trusted publishing; no API token needed.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract the release notes for this version from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          notes = match.group(1).strip() if match else f"Release {version}."
          pathlib.Path("release-notes.md").write_text(notes + "\n")
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
