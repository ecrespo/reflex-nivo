[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-nivo"
version = "0.1.0"
description = "Every nivo chart (bar, line, pie, sankey, treemap, choropleth... 51 components) as a Reflex component."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = ["reflex", "reflex-custom-components", "nivo", "d3", "charts", "dataviz", "visualization"]

dependencies = ["reflex>=0.9.0"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-nivo"
Source = "https://github.com/ecrespo/reflex-nivo"
Issues = "https://github.com/ecrespo/reflex-nivo/issues"
Changelog = "https://github.com/ecrespo/reflex-nivo/blob/main/CHANGELOG.md"
nivo = "https://nivo.rocks"

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]
lint = ["ruff==0.16.8"]
security = ["bandit[toml]==1.9.4", "pip-audit==2.10.1"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_nivo = ["py.typed", "*.pyi", "charts/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".web", ".states", "nivo_demo/.web"]

[tool.ruff.format]
# charts/ is generated by scripts/generate_components.py and the Reflex pyi
# generator; formatting it by hand would drift on the next regeneration.
exclude = ["custom_components/reflex_nivo/charts/*"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP", "W"]
ignore = [
    "E501",    # line length is owned by the formatter
    "RUF012",  # rx.State subclasses need mutable defaults
]

[tool.ruff.lint.per-file-ignores]
# Generated wrappers: import lists and annotations follow the generator, not
# hand-written style.
"custom_components/reflex_nivo/charts/*" = ["A002", "F401", "I001", "PIE790", "UP037", "UP045", "W291"]
# Stubs come from the Reflex pyi generator.
"*.pyi" = ["A002", "I001", "PIE790", "UP037", "UP045", "W291"]

[tool.bandit]
exclude_dirs = [".venv", "nivo_demo/.web", "tests"]
# B311: the demo builds sample chart data with `random`; it is never used for
# anything security relevant.
skips = ["B311"]
